name: Build IZI Transfer
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/build.yml'
jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Check Python syntax
        run: python -m compileall -q src
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build application
        run: python -m PyInstaller --noconfirm --clean --windowed --name "IZI Transfer" --paths src src/app.py
      - name: Create bundled payload (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/IZI Transfer" -DestinationPath payload.zip
      - name: Create bundled payload (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -qr ../payload.zip "IZI Transfer.app"
      - name: Build graphical installer
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "IZI-Transfer-Setup" --add-data "payload.zip:." installer.py
      - name: Rename installer for release
        shell: bash
        run: |
          mkdir -p packages
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            cp "dist/IZI-Transfer-Setup.exe" "packages/IZI-Transfer-2.1.1-Windows-Setup.exe"
          else
            cd dist
            zip -qr "../packages/IZI-Transfer-2.1.1-macOS-Setup.zip" "IZI-Transfer-Setup.app"
          fi
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IZI-Transfer-Setup-${{ matrix.os }}
          path: packages/
  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: IZI-Transfer-Setup-*
          path: packages
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -s packages/IZI-Transfer-2.1.1-Windows-Setup.exe
          test -s packages/IZI-Transfer-2.1.1-macOS-Setup.zip
          if gh release view v2.1.1 >/dev/null 2>&1; then
            echo "Release v2.1.1 already exists; refusing to overwrite published binaries"
            exit 0
          fi
          gh release create v2.1.1 packages/* --title "IZI Transfer 2.1.1" --notes "Installer grafico per Windows e macOS."

